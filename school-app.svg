<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#141419" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B301" />
      <stop offset="100%" stop-color="#FF8A00" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c24" />
      <stop offset="100%" stop-color="#121217" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Glow Behind App Window -->
  <circle cx="400" cy="240" r="220" fill="#F5B301" opacity="0.07" filter="blur(40px)" />

  <!-- App Window Frame -->
  <g filter="url(#cardGlow)">
    <rect x="40" y="35" width="720" height="410" rx="14" fill="#0f0f13" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Window Topbar -->
    <rect x="40" y="35" width="720" height="42" rx="14" fill="#17171e" />
    <rect x="40" y="63" width="720" height="14" fill="#17171e" />
    <line x1="40" y1="77" x2="760" y2="77" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Traffic Lights -->
    <circle cx="65" cy="56" r="5" fill="#ff5f56" />
    <circle cx="82" cy="56" r="5" fill="#ffbd2e" />
    <circle cx="99" cy="56" r="5" fill="#27c93f" />

    <!-- App Title & Breadcrumb -->
    <text x="125" y="60" fill="#888899" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600">Inteovo Edu — School Automation Software</text>
    <rect x="580" y="47" width="160" height="20" rx="6" fill="rgba(245,179,1,0.12)" stroke="rgba(245,179,1,0.3)" />
    <text x="660" y="61" text-anchor="middle" fill="#F5B301" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700">TypeScript • React • Postgres</text>

    <!-- Sidebar Navigation -->
    <rect x="40" y="77" width="170" height="368" fill="#131319" />
    <line x1="210" y1="77" x2="210" y2="445" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Nav Menu Items -->
    <g transform="translate(56, 100)">
      <!-- Item 1 (Active): Attendance -->
      <rect x="0" y="0" width="138" height="32" rx="6" fill="rgba(245,179,1,0.15)" stroke="rgba(245,179,1,0.3)" />
      <circle cx="16" cy="16" r="4" fill="#F5B301" />
      <text x="32" y="20" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Attendance Mgmt</text>

      <!-- Item 2: Payroll System -->
      <text x="32" y="58" fill="#8e8ea0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Payroll System</text>
      <circle cx="16" cy="54" r="3" fill="#555" />

      <!-- Item 3: Staff Registry -->
      <text x="32" y="94" fill="#8e8ea0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Staff & Faculty</text>
      <circle cx="16" cy="90" r="3" fill="#555" />

      <!-- Item 4: Student Database -->
      <text x="32" y="130" fill="#8e8ea0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Student Records</text>
      <circle cx="16" cy="126" r="3" fill="#555" />

      <!-- Item 5: Custom Reports -->
      <text x="32" y="166" fill="#8e8ea0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Reports & Analytics</text>
      <circle cx="16" cy="162" r="3" fill="#555" />
    </g>

    <!-- Main Content Area -->
    <g transform="translate(230, 95)">
      <!-- Metric Cards Row -->
      <!-- Card 1: Daily Staff Attendance -->
      <rect x="0" y="0" width="158" height="74" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
      <text x="14" y="22" fill="#888899" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">STAFF ATTENDANCE</text>
      <text x="14" y="52" fill="#27c93f" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">98.4%</text>
      <text x="88" y="50" fill="#888899" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">142 / 144</text>

      <!-- Card 2: Student Attendance -->
      <rect x="172" y="0" width="158" height="74" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
      <text x="186" y="22" fill="#888899" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">STUDENT ATTENDANCE</text>
      <text x="186" y="52" fill="#F5B301" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">96.8%</text>
      <text x="268" y="50" fill="#888899" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">2,180 / 2,250</text>

      <!-- Card 3: Monthly Payroll Status -->
      <rect x="344" y="0" width="168" height="74" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
      <text x="358" y="22" fill="#888899" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">PAYROLL STATUS</text>
      <text x="358" y="52" fill="#38bdf8" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">DISBURSED</text>
      <circle cx="488" cy="46" r="5" fill="#38bdf8" />

      <!-- Center Analytics Dashboard / Table -->
      <rect x="0" y="90" width="512" height="235" rx="8" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="114" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Live Attendance & Payroll Flow</text>
      <text x="380" y="114" fill="#F5B301" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">● PostgreSQL Sync Active</text>
      
      <!-- Table Headers -->
      <line x1="0" y1="126" x2="512" y2="126" stroke="rgba(255,255,255,0.06)" />
      <text x="16" y="142" fill="#666677" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">STAFF NAME</text>
      <text x="150" y="142" fill="#666677" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">DEPARTMENT</text>
      <text x="280" y="142" fill="#666677" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">ATTENDANCE</text>
      <text x="420" y="142" fill="#666677" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600">PAYROLL STATUS</text>

      <!-- Row 1 -->
      <line x1="16" y1="152" x2="496" y2="152" stroke="rgba(255,255,255,0.04)" />
      <text x="16" y="170" fill="#dddddd" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Dr. Rajesh Kumar</text>
      <text x="150" y="170" fill="#9999aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Computer Science</text>
      <text x="280" y="170" fill="#27c93f" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Present (On Time)</text>
      <text x="420" y="170" fill="#F5B301" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Processed</text>

      <!-- Row 2 -->
      <line x1="16" y1="184" x2="496" y2="184" stroke="rgba(255,255,255,0.04)" />
      <text x="16" y="202" fill="#dddddd" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Mrs. Ananya Sharma</text>
      <text x="150" y="202" fill="#9999aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Mathematics</text>
      <text x="280" y="202" fill="#27c93f" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Present</text>
      <text x="420" y="202" fill="#F5B301" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Processed</text>

      <!-- Row 3 -->
      <line x1="16" y1="216" x2="496" y2="216" stroke="rgba(255,255,255,0.04)" />
      <text x="16" y="234" fill="#dddddd" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Mr. Dixson (Head)</text>
      <text x="150" y="234" fill="#9999aa" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Product Dept</text>
      <text x="280" y="234" fill="#27c93f" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Present</text>
      <text x="420" y="234" fill="#F5B301" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Processed</text>

      <!-- Chart Visual Indicator on Bottom of Card -->
      <line x1="16" y1="248" x2="496" y2="248" stroke="rgba(255,255,255,0.04)" />
      <g transform="translate(16, 262)">
        <text x="0" y="32" fill="#777788" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">7-Day Attendance Rate</text>
        <polyline points="150,30 200,24 250,28 300,16 350,20 400,12 450,14" fill="none" stroke="url(#amberGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="450" cy="14" r="3.5" fill="#FF8A00" />
      </g>
    </g>
  </g>
</svg>
